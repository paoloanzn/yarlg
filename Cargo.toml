[package]
name = "yarlg"
description = "A blazingly fast Lexer generator library."
authors = ["Paolo Anzani <paoloanzn@gmail.com>"]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/paoloanzn/yarlg"
readme = "README.md"
keywords = ["lexer", "library", "compiler", "dfa", "nfa"]
license = "MIT"
exclude = [".github"]

[dependencies]
# none :)

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[lib]
path = "src/yarlg.rs"
